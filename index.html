<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Hub</title>
<style>
:root{--ink:#16202a;--muted:#5d6b78;--line:#d5dde4;--bg:#eef2f5;--card:#fff;--accent:#0f6b4f;--warn:#b3261e;--low:#c77d0a}
@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--muted:#93a1ae;--line:#2b3742;--bg:#0f161c;--card:#172029;--accent:#3fbf94;--warn:#ff8a80;--low:#f0b44c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:var(--ink);color:var(--bg);padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.15rem;margin:0;flex:1}
header input{padding:7px 10px;border-radius:6px;border:1px solid var(--line);min-width:230px}
main{max-width:980px;margin:0 auto;padding:20px}
nav{display:flex;gap:4px;margin-bottom:16px}
nav button{padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;border-radius:6px}
nav button[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:flex;flex-direction:column;font-size:.9rem;color:var(--muted);gap:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.full{grid-column:1/-1}
.btn{padding:10px 18px;background:var(--accent);color:#fff;border:0;border-radius:6px;font:inherit;cursor:pointer}
#msg{margin:12px 0;min-height:1.4em}.err{color:var(--warn)}.ok{color:var(--accent)}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px}
#list{list-style:none;margin:10px 0 0;padding:0;max-height:480px;overflow:auto}
#list li button{width:100%;text-align:left;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
#list li button:hover,#list li button[aria-current=true]{background:var(--bg)}
#list small{display:block;color:var(--muted)}
.profile{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.profile img,.noimg{width:110px;height:110px;object-fit:cover;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.noimg{display:grid;place-items:center;color:var(--muted);font-size:.8rem}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}dt{color:var(--muted)}dd{margin:0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:var(--bg);border-radius:4px;min-width:90px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.bar i.low{background:var(--low)}
@media(max-width:720px){form,.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Attendance Hub</h1>
  <input id="key" type="password" placeholder="Paste your API key" aria-label="API key" autocomplete="off">
</header>
<main>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="reg">Register student</button>
    <button role="tab" aria-selected="false" data-tab="stu">Students</button>
  </nav>
  <div id="msg" role="status"></div>

  <section id="reg" class="card">
    <form id="regform">
      <label>Matric number<input name="matric_number" required></label>
      <label>Full name<input name="full_name" required></label>
      <label>Department<input name="department"></label>
      <label>Level<select name="level"><option value="">Select</option><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option></select></label>
      <label>Email<input name="email" type="email"></label>
      <label>Phone<input name="phone" type="tel"></label>
      <label class="full">Photo<input name="photo" type="file" accept="image/*" capture="user"></label>
      <label class="full">Other details (optional, one per line as name: value)<textarea name="extra_text" rows="3" placeholder="State of origin: Cross River"></textarea></label>
      <div class="full"><button class="btn" type="submit">Register student</button></div>
    </form>
  </section>

  <section id="stu" hidden>
    <div class="split">
      <div class="card">
        <input id="q" type="search" placeholder="Search name or matric number" aria-label="Search students" style="width:100%">
        <ul id="list"></ul>
      </div>
      <div class="card" id="detail"><p style="color:var(--muted)">Select a student to see their details and attendance.</p></div>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const keyEl = $("#key"); keyEl.value = sessionStorage.getItem("hubkey") || "";
keyEl.addEventListener("change", () => sessionStorage.setItem("hubkey", keyEl.value.trim()));
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function say(text, ok){ const m=$("#msg"); m.textContent=text; m.className = ok ? "ok" : "err"; }
async function api(path, opts = {}){
  const r = await fetch("/api" + path, {...opts, headers: {"X-API-Key": keyEl.value.trim(), ...(opts.headers||{})}});
  const data = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(r.status === 401 ? "Enter a valid API key at the top of the page." : (typeof data.detail === "string" ? data.detail : "Something went wrong. Check the form and try again."));
  return data;
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  $("#reg").hidden = b.dataset.tab !== "reg"; $("#stu").hidden = b.dataset.tab !== "stu";
  say(""); if(b.dataset.tab === "stu") loadList();
});

$("#regform").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const extra = {};
  (fd.get("extra_text")||"").split("\n").forEach(l => { const i=l.indexOf(":"); if(i>0) extra[l.slice(0,i).trim()] = l.slice(i+1).trim(); });
  fd.delete("extra_text"); fd.set("extra", JSON.stringify(extra));
  try {
    const s = await api("/students", {method:"POST", body: fd});
    say(`Registered ${s.full_name} (${s.matric_number}).`, true); e.target.reset();
  } catch(err){ say(err.message); }
});

let timer; $("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadList, 250); });
async function loadList(){
  try {
    const rows = await api("/students?q=" + encodeURIComponent($("#q").value));
    $("#list").innerHTML = rows.length ? rows.map(s => `<li><button data-m="${esc(s.matric_number)}">${esc(s.full_name)}<small>${esc(s.matric_number)}</small></button></li>`).join("")
      : `<li style="padding:10px;color:var(--muted)">No students found. Register one from the first tab.</li>`;
    document.querySelectorAll("#list button").forEach(b => b.onclick = () => showStudent(b));
  } catch(err){ say(err.message); }
}
async function showStudent(btn){
  document.querySelectorAll("#list button").forEach(x => x.removeAttribute("aria-current")); btn.setAttribute("aria-current", "true");
  try {
    const s = await api("/students/" + encodeURIComponent(btn.dataset.m));
    const extra = Object.entries(s.extra||{}).map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
    const rows = s.attendance.map(a => `<tr><td>${esc(a.course)}</td><td>${esc(a.semester)}</td><td>${a.attended} of ${a.total}</td>
      <td><div class="bar" title="${a.percent}%"><i class="${a.percent < 75 ? "low" : ""}" style="width:${a.percent||0}%"></i></div></td><td>${a.percent ?? "–"}%</td></tr>`).join("");
    $("#detail").innerHTML = `<div class="profile">${s.photo_url ? `<img src="${esc(s.photo_url)}" alt="Photo of ${esc(s.full_name)}">` : `<div class="noimg">No photo</div>`}
      <div><h2 style="margin:0">${esc(s.full_name)}</h2><dl><dt>Matric</dt><dd>${esc(s.matric_number)}</dd><dt>Department</dt><dd>${esc(s.department||"–")}</dd>
      <dt>Level</dt><dd>${esc(s.level||"–")}</dd><dt>Email</dt><dd>${esc(s.email||"–")}</dd><dt>Phone</dt><dd>${esc(s.phone||"–")}</dd>${extra}</dl></div></div>
      <h3>Attendance</h3>${rows ? `<table><thead><tr><th>Course</th><th>Semester</th><th>Attended</th><th></th><th>Rate</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p style="color:var(--muted)">No attendance uploaded for this student yet.</p>`}`;
  } catch(err){ say(err.message); }
}
</script>
</body>
</html>
